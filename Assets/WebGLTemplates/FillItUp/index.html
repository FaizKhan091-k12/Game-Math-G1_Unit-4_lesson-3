<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <!-- Same structure as Unity's Default template (buildUrl / loaderUrl / config lines), so post-build tools that
         rename the Build files and rewrite those lines keep working. -->
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <h1 id="unity-loading-title">{{{ PRODUCT_NAME }}}</h1>
        <div id="unity-drop">
          <svg viewBox="0 0 100 140"><defs><clipPath id="drop-clip"><path d="M50 4 C50 4 8 60 8 92 a42 42 0 0 0 84 0 C92 60 50 4 50 4Z"/></clipPath></defs>
            <path d="M50 4 C50 4 8 60 8 92 a42 42 0 0 0 84 0 C92 60 50 4 50 4Z" fill="#ffffff" stroke="#1c76c2" stroke-width="6"/>
            <rect id="drop-level" x="0" y="140" width="100" height="140" fill="#3fb6ff" clip-path="url(#drop-clip)"/>
            <circle cx="36" cy="88" r="7" fill="#1b2440"/><circle cx="64" cy="88" r="7" fill="#1b2440"/>
            <path d="M38 106 q12 10 24 0" stroke="#1b2440" stroke-width="5" fill="none" stroke-linecap="round"/></svg>
        </div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
        <div id="unity-loading-message">Filling up...</div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Warnings are logged, not shown over the game (children should never see a banner).
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        warningBanner.style.display = 'none';
        if (type == 'error') document.querySelector("#unity-loading-message").textContent = msg;
        console.warn(msg);
      }

      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        matchWebGLToCanvasSize: true,
        // Cap the render resolution: sharp on retina screens, cheap on low-end GPUs.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2),
      };

      function setProgress(p) {
        document.querySelector("#unity-progress-bar-full").style.width = 100 * p + "%";
        document.querySelector("#drop-level").setAttribute("y", String(140 - 140 * p));
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, setProgress).then(function (unityInstance) {
          setProgress(1);
          document.querySelector("#unity-loading-bar").classList.add("done");
          canvas.focus();
        }).catch(function (message) {
          document.querySelector("#unity-loading-message").textContent = "Sorry, the game could not start: " + message;
        });
      };
      document.body.appendChild(script);

      // keep keyboard focus on the game after taps, and stop the page from scrolling/zooming on phones
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
    </script>
  </body>
</html>
